name = "savecents-otp"
main = "src/index.js"
compatibility_date = "2026-06-01"

# 1) Run:  wrangler kv namespace create OTP_KV
# 2) Paste the printed id below (replace REPLACE_ME).
[[kv_namespaces]]
binding = "OTP_KV"
id = "1fa37f38faa6415782c012de8ba905a7"

[vars]
SENDER_NAME = "SaveCents"
# v5.49.1: domain authenticated in Brevo (DKIM verified) - emails now send
# from the brand. Replies route to the human inbox via REPLY_TO_EMAIL.
SENDER_EMAIL = "noreply@savecents.app"
REPLY_TO_EMAIL = "support@savecents.app"

# Secret (never in this file):  wrangler secret put BREVO_API_KEY
